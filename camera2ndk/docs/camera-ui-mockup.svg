<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 920" width="100%">
  <defs>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16243f"/>
      <stop offset="0.42" stop-color="#2c4a72"/>
      <stop offset="0.6" stop-color="#7a6f8f"/>
      <stop offset="0.72" stop-color="#ff9d5c"/>
      <stop offset="0.8" stop-color="#c75b53"/>
      <stop offset="1" stop-color="#1c1622"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="0.55" stop-color="#ffd089"/>
      <stop offset="1" stop-color="#ffd089" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="shutter" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe3ea"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b79cff"/>
      <stop offset="1" stop-color="#8ab4f8"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="shs" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="680" height="920" fill="#0e0e12"/>

  <text x="40" y="42" font-family="sans-serif" font-size="15" font-weight="500" fill="#e8e8ee">Camera UI — high-fidelity mockup</text>
  <text x="40" y="62" font-family="sans-serif" font-size="13" fill="#9a9aa6">Material 3 · dark · frosted-glass controls over live preview · accent = dynamic color</text>

  <!-- phone -->
  <rect x="210" y="78" width="260" height="794" rx="46" fill="#050507" stroke="#33333d" stroke-width="2"/>
  <!-- preview -->
  <rect x="216" y="84" width="248" height="782" rx="40" fill="url(#photo)"/>
  <circle cx="345" cy="318" r="46" fill="url(#sun)"/>
  <path d="M216 742 L268 686 L308 720 L352 648 L398 712 L464 676 L464 866 L216 866 Z" fill="#0c0a12" fill-opacity="0.78"/>
  <rect x="216" y="84" width="248" height="782" rx="40" fill="url(#vig)"/>

  <!-- L2 top bar (frosted pill) -->
  <g filter="url(#sh)">
    <rect x="228" y="98" width="224" height="46" rx="23" fill="#14141c" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.14"/>
  </g>
  <g>
    <circle cx="258" cy="121" r="16" fill="#ffffff" fill-opacity="0.12"/>
    <path d="M258 113 L254 122 L258 122 L256 129 L263 119 L259 119 Z" fill="#b79cff"/>
    <circle cx="297" cy="121" r="16" fill="#ffffff" fill-opacity="0.12"/>
    <text x="297" y="125" font-family="sans-serif" font-size="9" font-weight="500" fill="#b79cff" text-anchor="middle">HDR</text>
    <circle cx="336" cy="121" r="16" fill="#ffffff" fill-opacity="0.12"/>
    <text x="336" y="125" font-family="sans-serif" font-size="9" fill="#e8e8ee" text-anchor="middle">4:3</text>
    <circle cx="375" cy="121" r="16" fill="#ffffff" fill-opacity="0.12"/>
    <path d="M375 114 l2.4 5 5.4 .6 -4 3.8 1.1 5.3 -4.9 -2.7 -4.9 2.7 1.1 -5.3 -4 -3.8 5.4 -.6 Z" fill="#e8e8ee"/>
    <circle cx="414" cy="121" r="16" fill="#ffffff" fill-opacity="0.12"/>
    <g stroke="#e8e8ee" stroke-width="1.4" fill="none">
      <circle cx="414" cy="121" r="6.5"/>
      <line x1="414" y1="111" x2="414" y2="114"/><line x1="414" y1="128" x2="414" y2="131"/>
      <line x1="404" y1="121" x2="407" y2="121"/><line x1="421" y1="121" x2="424" y2="121"/>
      <line x1="407" y1="114" x2="409" y2="116"/><line x1="419" y1="126" x2="421" y2="128"/>
      <line x1="421" y1="114" x2="419" y2="116"/><line x1="409" y1="126" x2="407" y2="128"/>
    </g>
  </g>

  <!-- AI scene chip -->
  <g filter="url(#shs)">
    <rect x="262" y="156" width="156" height="30" rx="15" fill="#b79cff" fill-opacity="0.22" stroke="#b79cff" stroke-opacity="0.55"/>
  </g>
  <path d="M276 171 l1.6 3.3 3.6 .4 -2.7 2.5 .7 3.5 -3.2 -1.8 -3.2 1.8 .7 -3.5 -2.7 -2.5 3.6 -.4 Z" fill="#e8e8ee"/>
  <text x="294" y="175" font-family="sans-serif" font-size="12" font-weight="500" fill="#ffffff">Portrait detected</text>

  <!-- zoom pill -->
  <g filter="url(#shs)">
    <rect x="300" y="196" width="80" height="26" rx="13" fill="#14141c" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>
  <text x="340" y="213" font-family="sans-serif" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">1.0×</text>

  <!-- EV slider (right) -->
  <rect x="446" y="300" width="4" height="236" rx="2" fill="#ffffff" fill-opacity="0.22"/>
  <circle cx="448" cy="402" r="9" fill="#ffffff" stroke="#b79cff" stroke-width="2.5"/>
  <text x="438" y="294" font-family="sans-serif" font-size="10" fill="#e8e8ee" text-anchor="middle">EV</text>

  <!-- focus ring -->
  <rect x="306" y="392" width="68" height="68" rx="8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9"/>
  <path d="M306 410 h-6 M306 442 h-6 M374 410 h6 M374 442 h6 M324 392 v-6 M356 392 v-6 M324 460 v6 M356 460 v6" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9"/>
  <text x="340" y="428" font-family="sans-serif" font-size="11" font-weight="500" fill="#ffffff" text-anchor="middle">AF</text>

  <!-- leveler -->
  <circle cx="340" cy="512" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="340" cy="512" r="5" fill="#5ec26a"/>

  <!-- L5 mode tabs -->
  <g filter="url(#sh)">
    <rect x="235" y="636" width="210" height="36" rx="18" fill="#14141c" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.14"/>
  </g>
  <rect x="303" y="640" width="74" height="28" rx="14" fill="url(#accent)"/>
  <text x="340" y="659" font-family="sans-serif" font-size="12" font-weight="500" fill="#0e0e12" text-anchor="middle">Photo</text>
  <text x="272" y="659" font-family="sans-serif" font-size="12" fill="#cfcfd6" text-anchor="middle">Portrait</text>
  <text x="408" y="659" font-family="sans-serif" font-size="12" fill="#cfcfd6" text-anchor="middle">Video</text>

  <!-- L5 bottom control bar (frosted) -->
  <g filter="url(#sh)">
    <rect x="226" y="682" width="228" height="120" rx="32" fill="#14141c" fill-opacity="0.58" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>

  <!-- thumbnail -->
  <circle cx="266" cy="742" r="27" fill="url(#photo)"/>
  <circle cx="266" cy="742" r="27" fill="none" stroke="#b79cff" stroke-width="2.5"/>
  <circle cx="266" cy="742" r="27" fill="#000000" fill-opacity="0.05"/>

  <!-- shutter -->
  <circle cx="340" cy="742" r="41" fill="#ffffff" fill-opacity="0.14"/>
  <circle cx="340" cy="742" r="41" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="340" cy="742" r="32" fill="url(#shutter)" filter="url(#shs)"/>

  <!-- flip -->
  <circle cx="414" cy="742" r="27" fill="#ffffff" fill-opacity="0.14"/>
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M404 736 a10 10 0 1 1 3 7"/>
    <path d="M424 748 a10 10 0 1 1 -3 -7"/>
    <path d="M404 736 l0 5 5 0"/>
    <path d="M424 748 l0 -5 -5 0"/>
  </g>

  <!-- caption legend -->
  <text x="40" y="892" font-family="sans-serif" font-size="11" fill="#7a7a86">Live preview (gradient placeholder) underneath frosted controls · accent = M3 dynamic color · active states tinted purple/blue</text>
</svg>

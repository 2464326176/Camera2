<svg viewBox="0 0 680 920" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Camera UI layered overlay architecture</title>
  <desc>Material 3 camera app: full-screen PreviewView with translucent control layers (top bar, zoom/EV, pro panel, bottom control region), plus a half-screen More Sheet.</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="920" fill="#0E0E12"/>
  <text x="40" y="38" fill="#E8E8EE" font-family="sans-serif" font-size="15" font-weight="500">Camera UI — layered overlay architecture (Material 3)</text>
  <text x="40" y="58" fill="#9A9AA6" font-family="sans-serif" font-size="13">PreviewView plus translucent control layers · foldable &amp; tablet responsive</text>

  <!-- phone frame -->
  <rect x="210" y="80" width="260" height="800" rx="42" fill="#16161C" stroke="#2E2E38" stroke-width="1.5"/>
  <rect x="218" y="88" width="244" height="784" rx="34" fill="#23262F"/>

  <!-- grid overlay (L1) -->
  <g stroke="#3A3F4C" stroke-width="1" opacity="0.55">
    <line x1="299" y1="88" x2="299" y2="872"/>
    <line x1="381" y1="88" x2="381" y2="872"/>
    <line x1="218" y1="346" x2="462" y2="346"/>
    <line x1="218" y1="614" x2="462" y2="614"/>
  </g>

  <!-- L2 top action bar -->
  <rect x="226" y="96" width="228" height="40" rx="16" fill="#16161C" opacity="0.85"/>
  <g fill="#2C2F38">
    <circle cx="250" cy="116" r="11"/><circle cx="294" cy="116" r="11"/>
    <circle cx="338" cy="116" r="11"/><circle cx="382" cy="116" r="11"/>
    <circle cx="426" cy="116" r="11"/>
  </g>
  <g fill="#CFCBD6" font-family="sans-serif" font-size="9" text-anchor="middle">
    <text x="250" y="119">F</text><text x="294" y="119">H</text>
    <text x="338" y="119">AI</text><text x="382" y="119">∷</text>
    <text x="426" y="119">⚙</text>
  </g>

  <!-- AI scene chip -->
  <rect x="280" y="150" width="120" height="22" rx="11" fill="#534AB7"/>
  <text x="340" y="164" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle">Portrait</text>

  <!-- L3 zoom pill -->
  <rect x="250" y="182" width="180" height="26" rx="13" fill="#2C2F38"/>
  <g font-family="sans-serif" font-size="11" text-anchor="middle">
    <text x="276" y="199" fill="#9A9AA6">0.6</text>
    <text x="320" y="199" fill="#E8E8EE" font-weight="500">1</text>
    <text x="364" y="199" fill="#9A9AA6">2</text>
    <text x="408" y="199" fill="#9A9AA6">5</text>
  </g>

  <!-- EV vertical slider -->
  <rect x="442" y="250" width="8" height="300" rx="4" fill="#3A3F4C"/>
  <circle cx="446" cy="360" r="9" fill="#7F77DD"/>
  <text x="446" y="244" fill="#9A9AA6" font-family="sans-serif" font-size="10" text-anchor="middle">EV</text>

  <!-- focus ring (AF box) -->
  <rect x="306" y="380" width="64" height="64" rx="6" fill="none" stroke="#7F77DD" stroke-width="2"/>
  <text x="338" y="372" fill="#7F77DD" font-family="sans-serif" font-size="10" text-anchor="middle">AF</text>

  <!-- leveler -->
  <circle cx="340" cy="470" r="20" fill="none" stroke="#3A3F4C" stroke-width="2"/>
  <circle cx="340" cy="470" r="5" fill="#639922"/>

  <!-- L5 mode tabs -->
  <rect x="226" y="628" width="228" height="30" rx="15" fill="#1B1E26"/>
  <rect x="300" y="632" width="80" height="22" rx="11" fill="#534AB7"/>
  <g font-family="sans-serif" font-size="11" text-anchor="middle">
    <text x="262" y="647" fill="#9A9AA6">Portrait</text>
    <text x="340" y="647" fill="#FFFFFF" font-weight="500">Photo</text>
    <text x="418" y="647" fill="#9A9AA6">Video</text>
  </g>

  <!-- L4 pro panel -->
  <rect x="226" y="706" width="228" height="64" rx="16" fill="#1B1E26"/>
  <text x="240" y="722" fill="#9A9AA6" font-family="sans-serif" font-size="10">PRO</text>
  <g fill="#2C2F38">
    <rect x="236" y="730" width="38" height="30" rx="8"/>
    <rect x="282" y="730" width="38" height="30" rx="8"/>
    <rect x="328" y="730" width="38" height="30" rx="8"/>
    <rect x="374" y="730" width="38" height="30" rx="8"/>
    <rect x="420" y="730" width="38" height="30" rx="8"/>
  </g>
  <g fill="#CFCBD6" font-family="sans-serif" font-size="9" text-anchor="middle">
    <text x="255" y="749">ISO</text><text x="301" y="749">S</text>
    <text x="347" y="749">EV</text><text x="393" y="749">AF</text>
    <text x="439" y="749">WB</text>
  </g>

  <!-- L5 bottom bar -->
  <rect x="226" y="662" width="228" height="104" rx="22" fill="#16161C"/>
  <circle cx="258" cy="712" r="22" fill="#2C2F38" stroke="#7F77DD" stroke-width="2"/>
  <circle cx="340" cy="714" r="38" fill="none" stroke="#E8E8EE" stroke-width="4"/>
  <circle cx="340" cy="714" r="30" fill="#E8E8EE"/>
  <circle cx="422" cy="712" r="22" fill="#2C2F38"/>
  <path d="M414 712a8 8 0 1 1 16 0" fill="none" stroke="#7F77DD" stroke-width="2"/>

  <!-- right: More Sheet mini -->
  <rect x="500" y="300" width="160" height="430" rx="20" fill="#1B1E26" stroke="#2E2E38" stroke-width="1"/>
  <text x="514" y="324" fill="#E8E8EE" font-family="sans-serif" font-size="13" font-weight="500">More Sheet</text>
  <text x="514" y="366" fill="#CFCBD6" font-family="sans-serif" font-size="11">Timer</text>
  <rect x="514" y="378" width="120" height="6" rx="3" fill="#3A3F4C"/>
  <circle cx="560" cy="381" r="7" fill="#7F77DD"/>
  <text x="514" y="436" fill="#CFCBD6" font-family="sans-serif" font-size="11">Filter</text>
  <rect x="514" y="448" width="120" height="6" rx="3" fill="#3A3F4C"/>
  <circle cx="600" cy="451" r="7" fill="#7F77DD"/>
  <text x="514" y="506" fill="#CFCBD6" font-family="sans-serif" font-size="11">Beauty</text>
  <rect x="514" y="518" width="120" height="6" rx="3" fill="#3A3F4C"/>
  <circle cx="540" cy="521" r="7" fill="#7F77DD"/>
  <line x1="500" y1="430" x2="454" y2="700" stroke="#7F77DD" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arw)"/>

  <!-- left annotations -->
  <g font-family="sans-serif" font-size="11" fill="#9A9AA6">
    <text x="40" y="106">Top bar</text>
    <text x="40" y="120">flash / HDR / ratio / settings</text>
    <text x="40" y="156">AI scene chip (animated)</text>
    <text x="40" y="300">Grid · leveler</text>
    <text x="40" y="314">AF box · EV slider</text>
    <text x="40" y="730">Pro panel</text>
    <text x="40" y="744">ISO / S / EV / AF / WB</text>
    <text x="40" y="780">Shutter · thumbnail</text>
    <text x="40" y="794">flip · mode tabs</text>
  </g>
  <g stroke="#7F77DD" stroke-width="1" stroke-dasharray="3 3" opacity="0.7">
    <line x1="180" y1="116" x2="226" y2="116"/>
    <line x1="200" y1="161" x2="280" y2="161"/>
    <line x1="190" y1="307" x2="306" y2="412"/>
    <line x1="190" y1="738" x2="226" y2="738"/>
    <line x1="190" y1="785" x2="226" y2="712"/>
  </g>

  <!-- legend -->
  <g font-family="sans-serif" font-size="11" fill="#9A9AA6">
    <text x="40" y="868">Layers: L0 preview · L1 overlay · L2 top · L3 zoom/EV · L4 pro · L5 bottom · Sheet = half-screen overlay</text>
  </g>
</svg>
